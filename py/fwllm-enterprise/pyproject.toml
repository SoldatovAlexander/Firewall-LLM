[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fwllm-enterprise"
version = "0.1.0"
description = "Firewall LLM enterprise modules (commercial license required)"
license = "LicenseRef-Commercial"
requires-python = ">=3.11"
dependencies = ["fwllm"]

[tool.setuptools.packages.find]
where = ["src"]
