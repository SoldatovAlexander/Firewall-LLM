[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fwllm"
version = "0.1.0"
description = "Firewall LLM - security gateway for LLM traffic"
license = "LicenseRef-FSL-1.1-MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    # R02: SOCKS proxy support for single_proxy egress (socksio backend).
    "httpx[socks]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "redis>=5.0",
    "prometheus-client>=0.20",
    "lightanon @ git+https://github.com/SoldatovAlexander/lightanon_project.git@b4a0bfd20bfab72e1b29316df5acd3a8dcd9bc35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "fakeredis>=2.20",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-PyYAML",
    "jsonschema>=4.21",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: tests hitting real external services"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# asserts are the point of tests
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "stubs"
