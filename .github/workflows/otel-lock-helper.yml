name: OTel lockfile helper

on:
  push:
    branches:
      - feature/otel-prototype
    paths:
      - rust/Cargo.toml
      - rust/fwllm-gateway/Cargo.toml
      - .github/workflows/otel-lock-helper.yml

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/otel-prototype
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate Cargo.lock
        working-directory: rust
        run: cargo generate-lockfile
      - name: Commit Cargo.lock if changed
        run: |
          if git diff --quiet -- rust/Cargo.lock; then
            echo "Cargo.lock already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/Cargo.lock
          git commit -m "otel prototype: update Cargo.lock"
          git push origin HEAD:feature/otel-prototype
