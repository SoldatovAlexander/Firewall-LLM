name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: py/fwllm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: py/fwllm/pyproject.toml
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Type check (mypy)
        run: mypy src
      - name: Test
        run: pytest tests -q --ignore-glob='*live*'
