name: Python CI

on:
  push:
    branches: [main]
    paths: ["py/**", "contracts/**", "deploy/**", ".github/workflows/python.yml"]
  pull_request:
    paths: ["py/**", "contracts/**", "deploy/**", ".github/workflows/python.yml"]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: py/fwllm
        run: pip install -e '.[dev]' && pip install -e ../fwllm-enterprise
      - name: Lint (ruff)
        working-directory: py/fwllm
        run: ruff check src tests
      - name: Type check (mypy)
        working-directory: py/fwllm
        run: mypy src
      - name: Test
        working-directory: py/fwllm
        run: pytest tests -q -m "not live"
