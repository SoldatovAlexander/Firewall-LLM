global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # R15: scrape via Compose service DNS (not a hardcoded LAN IP), both
  # gateway branches. Auth uses a least-privilege metrics token read from a
  # mounted credentials file — never stored in git. The token must match
  # FWLLM_METRICS_TOKENS consumed by the gateways (see ../.env.example and
  # ./secrets/README.md). Unauthenticated scrapes get 401.
  - job_name: fwllm-gateway
    bearer_token_file: /etc/prometheus/fwllm_metrics_token
    static_configs:
      - targets: ["gateway:8080"]

  - job_name: fwllm-gateway-rust
    bearer_token_file: /etc/prometheus/fwllm_metrics_token
    static_configs:
      - targets: ["gateway-rust:8080"]
