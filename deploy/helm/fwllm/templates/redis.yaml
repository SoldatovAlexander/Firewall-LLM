{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fwllm.fullname" . }}-redis
  labels: {{- include "fwllm.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "fwllm.fullname" . }}-redis
  template:
    metadata:
      labels:
        app: {{ include "fwllm.fullname" . }}-redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image | default "redis:7-alpine" }}
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fwllm.fullname" . }}-redis
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: {{ include "fwllm.fullname" . }}-redis
{{- end }}
