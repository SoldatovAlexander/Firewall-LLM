apiVersion: v1
kind: Service
metadata:
  name: {{ include "fwllm.fullname" . }}
  labels: {{- include "fwllm.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.ingressPort }}
      targetPort: ingress
      protocol: TCP
      name: ingress
  selector: {{- include "fwllm.selectorLabels" . | nindent 4 }}
