services:
  redis:
    image: redis:7-alpine
    container_name: fwllm-redis
    restart: unless-stopped

  gateway:
    build: ./gateway
    container_name: fwllm-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      FWLLM_CONFIG: /etc/fwllm/fwllm.yaml
    volumes:
      - ./fwllm.yaml:/etc/fwllm/fwllm.yaml:ro
      - ./data:/data

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: fwllm-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.1.0
    container_name: fwllm-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}"
