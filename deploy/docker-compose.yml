services:
  redis:
    image: redis:7-alpine
    container_name: fwllm-redis
    restart: unless-stopped

  gateway:
    build: ./gateway
    container_name: fwllm-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      FWLLM_CONFIG: /etc/fwllm/fwllm.yaml
    volumes:
      - ./fwllm.yaml:/etc/fwllm/fwllm.yaml:ro
      - ./models:/models:ro
      - ./data:/data

  gateway-rust:
    build: ./gateway-rust
    container_name: fwllm-gateway-rust
    restart: unless-stopped
    ports:
      - "8081:8080"
      - "8443:8443"
    env_file: .env
    environment:
      FWLLM_CONFIG: /etc/fwllm/fwllm.yaml
      FWLLM_CERTS_DIR: /certs
    volumes:
      - ./fwllm.yaml:/etc/fwllm/fwllm.yaml:ro
      - ./certs:/certs
      - ./data-rust:/data

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: fwllm-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  mock-llm:
    build: ./mock-llm
    container_name: fwllm-mock-llm
    restart: unless-stopped
    ports:
      - "8001:8000"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: fwllm-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}"
